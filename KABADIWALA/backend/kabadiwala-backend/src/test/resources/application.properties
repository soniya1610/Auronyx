# Test Configuration (H2 in MySQL mode)
spring.datasource.url=jdbc:h2:mem:kabadiwala_test_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL;NON_KEYWORDS=USER
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Disable Flyway during tests so H2 creates schema via JPA ddl-auto
spring.flyway.enabled=false

# JWT test secret
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expiration=3600000

# OTP test settings
app.otp.expiration-minutes=5
app.otp.max-attempts=3

# CORS
cors.allowed-origins=http://localhost:3000
