spring.application.name=kabadiwala-backend-test

# H2 In-Memory Database for fast, isolated tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Disable flyway for test slice if ddl-auto creates tables, or let flyway run
spring.flyway.enabled=false

# JWT Test configuration
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expiration=86400000

# AI Test configuration
ai.service.url=http://localhost:8000
ai.mock.enabled=true
ai.service.timeout=1000
