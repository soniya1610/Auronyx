# Server Configuration
server.port=8080

# Spring Application
spring.application.name=kabadiwala-backend

# Datasource Configuration
# Supports both external MySQL (when DB_HOST / SPRING_DATASOURCE_URL is set) and persistent local H2 database in MySQL mode
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/kabadiwala_db;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Flyway Migrations
spring.flyway.enabled=${FLYWAY_ENABLED:false}

# Security & JWT (environment overrides)
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration=${JWT_EXPIRATION:86400000}

# CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# OTP Configuration
app.otp.expiration-minutes=5
app.otp.max-attempts=3

# External Services (AI/ML Module Integration)
ai.service.url=${AI_SERVICE_URL:http://localhost:8000}
